<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08172c">
  <title>Le laboratoire, en perspective</title>
  <link rel="icon" href="network-assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="network-assets/diagram.css?v=r3b">
</head>
<body class="at-home">
  <header class="topbar">
    <p class="brand"><svg viewBox="0 0 40 44" aria-hidden="true"><path d="M20 2 37 12v20L20 42 3 32V12Zm0 20L3 12m17 10 17-10M20 22v20"/></svg>Le laboratoire</p>
    <nav id="tabs" aria-label="Sections"></nav>
    <div class="top-actions">
      <button id="home-btn" type="button">Toutes les sections</button>
      <button id="security-btn" type="button" aria-haspopup="dialog">Sécurité</button>
      <button id="scenarios-btn" class="danger" type="button">Scénarios</button>
      <button id="reset-section" type="button">Réinitialiser la section</button>
      <button id="fullscreen" type="button" aria-keyshortcuts="F">Plein écran</button>
      <button id="toggle-2d" type="button" aria-pressed="false">Plan 2D</button>
    </div>
  </header>

  <main id="stage" aria-label="Maquette du laboratoire">
    <div id="scene-labels"></div>
    <div id="map2d" hidden></div>
    <div id="loading">Préparation du laboratoire…</div>
    <p id="fallback" hidden role="status">3D indisponible : plan 2D affiché.</p>

    <section id="home" aria-labelledby="home-title">
      <h1 id="home-title">Deux PC, cinq VM, quatre sections.</h1>
      <div id="home-cards"></div>
    </section>

    <aside id="info-panel" hidden aria-labelledby="info-title">
      <div class="info-head">
        <span id="info-icon" aria-hidden="true"></span>
        <button id="info-close" type="button" aria-label="Fermer la fiche">Fermer</button>
      </div>
      <p id="info-location" class="eyebrow"></p>
      <h2 id="info-title"></h2>
      <p id="info-role" class="role"></p>
      <p id="info-purpose"></p>
      <ul id="info-config" class="config"></ul>
      <details id="info-more">
        <summary>Configuration détaillée</summary>
        <div id="info-more-body"></div>
      </details>
    </aside>
  </main>

  <footer class="bottombar" aria-label="Étape">
    <button id="prev" type="button" aria-label="Retour : étape ou scène précédente" aria-keyshortcuts="ArrowLeft">Retour</button>
    <div class="caption">
      <div class="caption-head">
        <p id="position"></p>
        <div id="dots" role="group" aria-label="Étapes de la section"></div>
      </div>
      <h2 id="scene-title"></h2>
      <p id="scene-line" aria-live="polite"></p>
    </div>
    <div class="bar-actions">
      <details id="details">
        <summary>Détails</summary>
        <div id="details-body"></div>
      </details>
      <button id="tag-btn" class="tag-btn" type="button" hidden aria-describedby="tag-tip"></button>
      <button id="pause" type="button" hidden aria-pressed="false" aria-keyshortcuts="P">Pause</button>
      <button id="replay" type="button" hidden>Rejouer</button>
      <button id="proofs" type="button" hidden>Preuves</button>
    </div>
    <button id="next" class="primary" type="button" aria-keyshortcuts="ArrowRight">Suivant</button>
  </footer>

  <div id="tag-tip" role="tooltip" hidden>
    <strong id="tag-tip-title"></strong>
    <p id="tag-tip-text"></p>
    <button id="tag-tip-close" type="button" aria-label="Fermer l’explication">Fermer</button>
  </div>

  <dialog id="security" aria-labelledby="security-title">
    <header>
      <h2 id="security-title">Sécurité du laboratoire</h2>
      <button id="security-close" type="button">Fermer</button>
    </header>
    <div id="security-body"></div>
  </dialog>

  <dialog id="evidence" aria-labelledby="evidence-title">
    <header>
      <h2 id="evidence-title"></h2>
      <button id="evidence-close" type="button">Fermer</button>
    </header>
    <figure>
      <div class="frame">
        <img id="evidence-image" alt="">
        <p id="evidence-missing" hidden>Capture non incluse dans cette copie. La source datée reste dans les notes du dépôt.</p>
      </div>
      <figcaption id="evidence-caption"></figcaption>
    </figure>
    <footer>
      <p id="evidence-scope"></p>
      <div class="evidence-nav">
        <button id="evidence-prev" type="button" aria-label="Preuve précédente">←</button>
        <span id="evidence-count" aria-live="polite"></span>
        <button id="evidence-next" type="button" aria-label="Preuve suivante">→</button>
      </div>
    </footer>
  </dialog>

  <script type="module" src="network-assets/diagram.bundle.js?v=r3b"></script>
</body>
</html>
